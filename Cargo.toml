[package]
name = "ez-ffmpeg"
version = "0.17.2"
edition = "2021"
rust-version = "1.80"
authors = ["Yeauty <YeautyYE@gmail.com>"]
description = "A safe and ergonomic Rust interface for FFmpeg integration, designed for ease of use."
homepage = "https://github.com/YeautyYE/ez-ffmpeg"
documentation = "https://docs.rs/ez-ffmpeg"
readme = "README.md"
keywords = [
    "ffmpeg",
    "multimedia",
    "video",
    "audio",
    "rtmp",
]
categories = ["multimedia"]
license = "MIT OR Apache-2.0 OR MPL-2.0"
repository = "https://github.com/YeautyYE/ez-ffmpeg"

[dependencies]
log = "0.4"
thiserror = "1.0"
# 8.1.x is the first upstream line that supports FFmpeg 8 correctly (8.0.x
# crates fail against FFmpeg 8/8.1 headers). The crates still link FFmpeg
# 7.x installs: ffmpeg-sys-next probes the installed version and gates its
# bindings, so this bump does not drop FFmpeg 7 support.
ffmpeg-next = "8.1.0"
ffmpeg-sys-next = "8.1.0"
crossbeam = "0.8.4"
crossbeam-channel = "0.5.15"
libc = "0.2.159"

#opengl
surfman = { version = "0.9", features = ["chains"], optional = true }
glow = { version = "0.16", optional = true }
# `derive` lets the built-in effects declare their params structs as
# `#[derive(Pod, Zeroable)]`, which proves at compile time they carry no
# padding bytes (a hand-written `unsafe impl Pod` would not).
bytemuck = { version = "1.8", features = ["derive"], optional = true }

#wgpu
wgpu = { version = "26", optional = true }
pollster = { version = "0.4", optional = true }
# Raw Vulkan for zero-copy hardware-frame import (dmabuf). Must stay on the
# same major as wgpu-hal 26's ash, since raw handles cross that boundary.
ash = { version = "0.38", optional = true }

#flv
bytes = { version = "1.11.1", optional = true }

# http-input (default-off). Tokio is current-thread only (no rt-multi-thread).
# hyper-rustls / idna_adapter / zeroize / chacha20 / quinn* / crypto-mac /
# security-framework are resolver pins so Cargo 1.80 does not select
# Edition 2024 / MSRV 1.85 transitive crates. They stay optional here and
# are NOT activated by `http-input` (same as quinn). Drop the pins once
# upstream ranges stay on 1.80.
reqwest = { version = "=0.12.28", optional = true, default-features = false, features = ["rustls-tls-manual-roots", "stream"] }
tokio = { version = "=1.47.1", optional = true, default-features = false, features = ["rt", "net", "time", "sync", "macros"] }
futures-util = { version = "=0.3.31", optional = true, default-features = false, features = ["std"] }
rustls-native-certs = { version = "=0.8.4", optional = true }
# rustls 0.23.25+ needs subtle ^2.5; rml_rtmp → crypto-mac 0.10.1 pins
# subtle =2.4. Pin rustls to the spike-verified line and crypto-mac 0.10.0
# (no exact subtle pin) so default / --all-features resolution unifies.
rustls = { version = "=0.23.43", optional = true, default-features = false, features = ["ring", "std"] }
crypto-mac = { version = "=0.10.0", optional = true }
hyper-rustls = { version = "=0.27.7", optional = true, default-features = false }
idna_adapter = { version = "=1.1.0", optional = true, default-features = false }
zeroize = { version = "=1.8.2", optional = true, default-features = false }
# chacha20 0.10+ is Edition 2024 / MSRV 1.85; pin the last 1.80-compatible line.
chacha20 = { version = "=0.9.1", optional = true, default-features = false }
# reqwest lists quinn as an unused optional; 0.11.16+ pulls rand 0.10 → chacha20 0.10.
# Keep the pins; do not activate them from `http-input` (no HTTP/3).
# quinn-proto 0.11.15 clears RUSTSEC-2026-0037 / RUSTSEC-2026-0185 while
# staying on the 1.80-resolvable dependency set.
quinn = { version = "=0.11.9", optional = true, default-features = false }
quinn-proto = { version = "=0.11.15", optional = true, default-features = false }
# quinn-udp 0.5.15+ requires rustc 1.85.
quinn-udp = { version = "=0.5.14", optional = true, default-features = false }

#rtmp
rml_rtmp = { version = "0.8", optional = true }
slab = { version = "0.4", optional = true }
dashmap = { version = "6", optional = true }
byteorder = { version = "1.5", optional = true }
fontdb = { version = "0.23.0", optional = true }
ttf-parser = { version = "0.25.1", optional = true }
rustybuzz = { version = "0.20.1", optional = true }
zeno = { version = "0.3.3", optional = true }
unicode-bidi = { version = "0.3.18", optional = true }
unicode-linebreak = { version = "0.1.5", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
core-foundation = "0.10"

# Resolver pin: newer security-framework lines require Rust 1.85.
[target.'cfg(target_vendor = "apple")'.dependencies]
security-framework = { version = "=3.6.0", optional = true }

[features]
default = []
async = []
opengl = ["dep:surfman", "dep:glow", "dep:bytemuck"]
wgpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck", "dep:ash"]
rtmp = ["dep:rml_rtmp", "dep:slab", "dep:dashmap", "flv"]
flv = ["dep:bytes", "dep:byteorder"]
subtitle = [
    "dep:fontdb",
    "dep:ttf-parser",
    "dep:rustybuzz",
    "dep:zeno",
    "dep:unicode-bidi",
    "dep:unicode-linebreak",
]
static = ["ffmpeg-next/static"]
cli = []
http-input = [
    "dep:reqwest",
    "dep:tokio",
    "dep:futures-util",
    "dep:bytes",
    "dep:rustls-native-certs",
    "dep:rustls",
]

[package.metadata.docs.rs]
# docs.rs sets the `DOCS_RS` env var; `build.rs` turns it into `--cfg docsrs`,
# which compiles the crate's FFI call sites as stubs (see the `#[cfg(docsrs)]`
# gates in `src/`) so rustdoc can type-check without a matching FFmpeg dev
# environment. `docsrs` is intentionally NOT a Cargo feature, so
# `cargo build --all-features` always compiles the real FFmpeg path and never
# ships the crash-prone stub. Enable every real feature for full doc coverage.
features = ["async", "opengl", "rtmp", "flv", "subtitle", "wgpu", "cli", "http-input"]

[[example]]
name = "http_input"
required-features = ["http-input"]

[dev-dependencies]
env_logger = "0.10"
tokio = { version = "1", features = ["full"] }
# Integration tests shrink socket buffers (SO_RCVBUF) via setsockopt to make
# backpressure deterministic; libc is already a normal dependency.
libc = "0.2.159"
# Integration tests re-open output files and inspect raw AVStream fields
# (extradata / codec_type) that the public StreamInfo API does not expose.
ffmpeg-sys-next = "8.1.0"
# Offline WGSL parse/validation of the built-in wgpu shaders: errors would
# otherwise surface only at pipeline creation on a live GPU device. Same
# major as wgpu, which compiles these shaders with this naga at runtime.
naga = { version = "26", features = ["wgsl-in"] }
